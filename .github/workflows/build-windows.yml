name: Build Windows Installer

# Manual / tag-based build pipeline for the Hermes fork.
# Triggers:
#   - Push of a tag matching `build-*` or `v*-hermes*`
#   - Manual run via the GitHub Actions tab (`workflow_dispatch`)
#
# Produces:
#   - NSIS installer  (.exe) — recommended
#   - MSI installer   (.msi) — optional, requires wix
# Uploads them as a workflow artifact + (for tag pushes) attaches to a
# GitHub Release. No code-signing — installer will show SmartScreen on
# first run, which is normal for unsigned community builds.

on:
  push:
    tags:
      - 'build-*'
      - 'v*-hermes*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release with the installer attached'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    name: Build NSIS installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --no-self-update

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build frontend
        run: bun run build:frontend

      - name: Build Tauri app (NSIS installer)
        run: bun run tauri build --bundles nsis

      - name: Locate installer
        id: locate
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis\*.exe" `
            | Select-Object -First 1
          if (-not $installer) {
            throw "No NSIS installer produced"
          }
          echo "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          echo "name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          echo "Installer: $($installer.FullName)"
          echo "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThukiWin-Hermes-Installer
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --title "ThukiWin (Hermes fork) $tag" `
              --notes "Unsigned community build with NVIDIA NIM via Hermes Agent gateway. Configure the Hermes provider in Settings -> Agent after install."
          }
          gh release upload $tag "${{ steps.locate.outputs.path }}" --clobber

      - name: Create GitHub Release (manual trigger, if requested)
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "manual-${{ github.run_number }}"
          gh release create $tag `
            --title "ThukiWin (Hermes fork) manual build #${{ github.run_number }}" `
            --notes "Manually triggered build from $(git rev-parse --short HEAD)" `
            "${{ steps.locate.outputs.path }}"
